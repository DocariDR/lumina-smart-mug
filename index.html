<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Smart Mug</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header id="header">
        <div class="logo-container">
            <span class="logo-text">Lumina</span>
        </div>
        <nav id="nav-bar">
            <a class="nav-link" href="#features">Features</a>
            <a class="nav-link" href="#how-it-works">How It Works</a>
            <a class="nav-link" href="#pricing">Pricing</a>
        </nav>
    </header>
    <main class="container">
        <section id="hero">
            <h2>The perfect temperature, every time.</h2>
            <p>Sign up for our newsletter to get notified when we launch!</p>
            <form id="form" action="https://www.freecodecamp.org/email-submit">
                <input 
                    id="email" 
                    type="email" 
                    name="email" 
                    placeholder="Enter your email address" 
                    required 
                />
                <input id="submit" type="submit" value="Subscribe" />
            </form>
        </section>
    </main>
</body>
</html>
